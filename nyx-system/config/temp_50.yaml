capital:
  currency: USD
  initial: 10000
execution:
  maker_fee: 0.0004
  slippage_bps: 5
  taker_fee: 0.001
metadata:
  baseline_code_version: v0.8.2-FINAL
  frozen_date: '2025-03-28'
  note: This configuration is FROZEN for entire Phase 1. Any changes invalidate all
    validation results.
  version: 1.0.0
pairs:
- BTCUSDT
- ETHUSDT
period:
  end: '2024-12-31'
  start: '2020-01-01'
strategy:
  hsmm:
    prob_threshold: 0.55
    sdc_threshold: 3.5
  min_required_bars: 50
  risk:
    base_size: 0.05
    bear_multiplier: 0.7
    bull_multiplier: 2.5
    max_position: 0.25
    range_multiplier: 1.0
    stop_loss: 0.05
    take_profit: 0.15
  smc:
    fvg_threshold: 0.01
    ob_range_threshold: 0.015
timeframe: 1h
validation:
  benchmarks:
  - buy_hold
  - sma_crossover
  - random_entry
  - hsmm_only
  - smc_only
  monte_carlo:
    confidence_levels:
    - 0.05
    - 0.25
    - 0.5
    - 0.75
    - 0.95
    runs: 1000
    seed: 42
  sensitivity:
    params_to_test:
    - sdc_threshold
    - prob_threshold
    - base_size
    - stop_loss
    - take_profit
    variations:
    - -20
    - -10
    - 10
    - 20
  signal_lookback_bars: 50
  walk_forward:
    step_months: 3
    test_months: 3
    train_months: 12
  warmup_bars: 100
