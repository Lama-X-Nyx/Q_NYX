# NYX Trading System Configuration

system:
  name: "NYX v0.8"
  version: "0.8.0"
  environment: "development"  # development, staging, production

data:
  source: "binance"
  timeframes: ["15m", "1h", "4h"]
  data_dir: "data/raw"
  processed_dir: "data/processed"

strategy:
  name: "NYX_v05"
  
  # HSMM Parameters
  hsmm:
    states: ["Trend+", "Range", "Trend-"]
    sdc_threshold: 3.5
    prob_threshold: 0.55
  
  # SMC Parameters
  smc:
    fvg_enabled: true
    ob_enabled: true
    ob_range_threshold: 0.015
  
  # Regime Detection
  regime:
    sma_period: 200
    slope_threshold: 0.01

risk:
  # Position Sizing
  base_size: 0.05  # 5% of capital
  max_position: 0.25  # 25% max
  
  # Pyramiding
  pyramid_enabled: true
  pyramid_threshold: 0.10  # Add at +10% profit
  pyramid_max: 3
  pyramid_size_multiplier: 0.5
  
  # Stop Loss
  stop_loss: 0.05  # 5%
  trailing_stop: false
  
  # Regime Multipliers
  bull_multiplier: 2.5
  bear_multiplier: 0.7
  range_multiplier: 1.0

backtest:
  initial_capital: 10000
  commission: 0.001  # 0.1% per trade
  slippage: 0.0005   # 0.05%
  
  # Monte Carlo
  monte_carlo_enabled: true
  monte_carlo_runs: 1000
  confidence_level: 0.95

execution:
  broker: "binance"
  live_trading: false
  paper_trading: true
  
  # Order Settings
  order_type: "market"
  retry_limit: 3
  timeout: 30

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  console: true
  file: true
  log_dir: "logs"
  
monitoring:
  enabled: false
  metrics_port: 9090
  dashboard_port: 8050
